# The Docker DNN experiment's Linux alternative (experiments/docker-dnn/vm): a Windows Server 2022 VM in a container
# (dockur/windows, QEMU/KVM) with IIS, SQL Server Express and DNN, checked from the Linux host. Commits the results to
# experiments/docker-dnn/test-results/ubuntu-vm on this branch. Only on the experiment branch, or by hand.
name: Docker DNN experiment - Windows VM on Linux

on:
  push:
    branches: [experiments/docker-dnn]
    paths:
      - 'experiments/docker-dnn/vm/**'
      - 'experiments/docker-dnn/scripts/test-vm.ps1'
      - '.github/workflows/docker-dnn-vm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-dnn-vm
  cancel-in-progress: true

jobs:
  vm:
    name: Ubuntu + KVM - Windows Server 2022 VM (dockur/windows) with IIS + DNN + SQL Server Express
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Room for the VM disk (/mnt) and KVM access
        run: |
          sudo mkdir -p /mnt/dnn-vm && sudo chown "$USER" /mnt/dnn-vm
          df -h / /mnt
          ls -l /dev/kvm
      - name: Run the experiment
        shell: pwsh
        working-directory: experiments/docker-dnn
        run: ./scripts/test-vm.ps1 -Name ubuntu-vm -Storage /mnt/dnn-vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-ubuntu-vm
          path: experiments/docker-dnn/test-results/ubuntu-vm
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/docker-dnn/test-results/ubuntu-vm
          git diff --cached --quiet && exit 0
          git commit -m "experiment: docker-dnn Windows VM results (run ${{ github.run_number }})"
          git pull --rebase
          git push
