# CI: on every commit pushed to a branch, and by hand (Actions -> CI -> Run workflow), the whole test suite runs (Test),
# then DNN Manager is built in Release (Build). Nothing is published here, and a version tag starts only the release
# workflow (.github/workflows/release.yml, see .docs/releasing.md).
name: CI

on:
  push:
    # Branches only: a version tag is the release workflow's.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build
    # Once the tests have passed.
    needs: test
    # A pinned image (as release.yml): a new Windows image is a change in review, not a surprise.
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      # Actions pinned to a commit, not a tag that can be moved: what runs is what was reviewed. Dependabot proposes updates.
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tags too: the build takes its version from the newest version tag (DnnManager.csproj, VersionFromGitTag).
          fetch-depth: 0
          # No token left in .git/config for the build's steps.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          # The SDK global.json names - exactly that one (rollForward: disable), the one releases are built with.
          global-json-file: global.json

      - name: Runner and SDK
        # What built this, for comparing two runs: the image's version and the SDK and runtimes it used.
        run: |
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          dotnet --info

      - name: Restore
        # Exactly the packages packages.lock.json names, with their hashes - a change to them fails here, not unnoticed.
        run: |
          dotnet restore tests/DnnManager.IntegrationTests/DnnManager.IntegrationTests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/DnnManager.Launcher/DnnManager.Launcher.csproj --locked-mode

      - name: Build (Release)
        # Warnings are errors - the XML comments' among them: misplaced (CS1587), badly formed (CS1570), a cref that is
        # ambiguous (CS0419) or names nothing (CS1574).
        run: |
          dotnet build tests/DnnManager.IntegrationTests/DnnManager.IntegrationTests.csproj -c Release --no-restore `
            -p:ContinuousIntegrationBuild=true -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The launcher as a plain .NET build: it compiles; the release workflow publishes it with Native AOT.
          dotnet build src/DnnManager.Launcher/DnnManager.Launcher.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -warnaserror

  test:
    name: Test
    runs-on: windows-2025
    timeout-minutes: 60

    env:
      # How many tests may be skipped (inconclusive) on the runner: the integration tests, where it lacks IIS Express,
      # LocalDB or Linux containers. More fails the run, and so does any skipped test outside TestCategory Integration -
      # a fast test that stops running mustn't pass as green. Set the repository variable CI_MAX_SKIPPED_TESTS to the
      # count the step summary shows once it is known, so a newly skipped integration test fails too.
      MAX_SKIPPED: ${{ vars.CI_MAX_SKIPPED_TESTS || '14' }}

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/DnnManager.IntegrationTests/DnnManager.IntegrationTests.csproj --locked-mode

      - name: Test
        # The whole suite (built here in Release). The integration tests need IIS Express, LocalDB and Docker (Linux
        # containers); where the runner lacks one, those tests are reported as skipped (inconclusive), not passed -
        # counted in the next step.
        run: >-
          dotnet test tests/DnnManager.IntegrationTests/DnnManager.IntegrationTests.csproj
          -c Release --no-restore -p:ContinuousIntegrationBuild=true
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults

      - name: Count skipped tests
        if: ${{ !cancelled() }}
        run: |
          $trx = Get-ChildItem TestResults -Recurse -Filter tests.trx | Select-Object -First 1
          if (-not $trx) { throw 'No test results (TestResults/tests.trx) - the tests didn''t run.' }
          [xml]$xml = [IO.File]::ReadAllText($trx.FullName)
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          # Each test's categories, by its id.
          $categories = @{}
          foreach ($test in (Select-Xml -Xml $xml -XPath '//t:UnitTest' -Namespace $ns).Node) {
            $categories[$test.id] = @($test.SelectNodes('.//*[local-name()="TestCategoryItem"]') | ForEach-Object { $_.TestCategory })
          }
          $results = @((Select-Xml -Xml $xml -XPath '//t:UnitTestResult' -Namespace $ns).Node)
          $skipped = @($results | Where-Object { $_.outcome -in 'NotExecuted', 'Inconclusive' })
          $fast = @($skipped | Where-Object { $categories[$_.testId] -notcontains 'Integration' })
          $lines = @("### Tests", '', "$($results.Count) run, $($skipped.Count) skipped (inconclusive) - at most $env:MAX_SKIPPED may be.", '')
          $lines += $skipped | ForEach-Object { "- $($_.testName)$(if ($categories[$_.testId] -notcontains 'Integration') { ' **(not an integration test)**' })" }
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $lines | ForEach-Object { Write-Host $_ }
          if ($fast.Count -gt 0) { throw "$($fast.Count) test(s) outside TestCategory Integration were skipped - a fast test must run everywhere." }
          if ($skipped.Count -gt [int]$env:MAX_SKIPPED) { throw "$($skipped.Count) tests were skipped, more than the $env:MAX_SKIPPED expected (CI_MAX_SKIPPED_TESTS)." }
